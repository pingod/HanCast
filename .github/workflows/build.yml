# 构建 macOS / Linux / Windows 安装包
#
# 说明：
#   - 仓库里 mpv/ 目录被 gitignore（~120MB，未提交）。CI 会为每个平台准备 MPV：
#       * macOS  / Windows : 从 mpv-player/mpv 官方 Release 下载对应平台二进制
#       * Linux          : 通过 apt 安装 mpv，再复制其二进制
#   - 不执行代码签名。
#   - 前端构建 + sidecar(Nuitka) 打包由 tauri.conf.json 的 beforeBuildCommand 自动完成，
#     CI 只需装好工具链、放好 mpv，然后调用 `tauri build`。
#
# 触发：
#   - push 标签 v*  → 自动构建并上传 draft Release
#   - 手动 workflow_dispatch → 构建；只有 ref 是 tag 且勾选 make_release 时才发布

name: Build Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      make_release:
        description: "构建成功后创建 draft GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # 缓存 / 镜像加速（可按需调整）
  UV_PYTHON_PREFERENCE: only-managed
  # 固定 MPV 版本，避免运行时依赖 api.github.com（易被限流 403）。
  # 资产已确认存在：mpv-v0.41.0-{macos-15-arm, x86_64-pc-windows-msvc}.zip
  MPV_TAG: "v0.41.0"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- macOS ----
          - name: macos-arm64
            os: macos-14
            runner-os: macOS
            arch: aarch64-apple-darwin
            # 只出 .app；dmg 必须等 sidecar 布局修好之后再打，见后面
            # 的 "Bundle macOS dmg" 步骤，否则 dmg 里不含符号链接。
            bundles: "app"
            mpv_suffix: "macos-15-arm"
          # ---- Windows ----
          - name: windows-x64
            os: windows-latest
            runner-os: Windows
            arch: x86_64-pc-windows-msvc
            bundles: "nsis"
            mpv_suffix: "x86_64-pc-windows-msvc"
          # ---- Linux ----
          - name: linux-x64
            os: ubuntu-latest
            runner-os: Linux
            arch: x86_64-unknown-linux-gnu
            bundles: "deb,rpm,appimage"
            mpv_suffix: ""   # Linux 走 apt

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      # ---------- 通用工具链 ----------
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup uv (Python)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Show toolchain versions
        shell: bash
        run: |
          set -e
          echo "=== OS ==="
          uname -a || true
          echo "=== rust ==="
          rustc --version
          cargo --version
          echo "=== node ==="
          node --version
          npm --version
          echo "=== uv ==="
          uv --version
          echo "=== python (managed) ==="
          uv run --project hancast-backend python --version 2>/dev/null || true

      # ---------- 平台依赖 ----------
      - name: Install Linux build deps (Tauri + Nuitka C compiler)
        if: matrix.runner-os == 'Linux'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            g++ pkg-config \
            mpv
          echo "Linux deps installed. mpv:"
          mpv --version | head -1 || true

      - name: Install frontend dependencies
        run: npm ci

      # ---------- 准备 MPV ----------

      - name: Download & unpack MPV (macOS / Windows)
        if: matrix.mpv_suffix != ''
        shell: bash
        env:
          MPV_SUFFIX: ${{ matrix.mpv_suffix }}
        run: |
          set -e
          url="https://github.com/mpv-player/mpv/releases/download/${MPV_TAG}/mpv-${MPV_TAG}-${MPV_SUFFIX}.zip"
          echo "Downloading: $url"
          curl -fsSL -o mpv.zip "$url"
          WS="$(pwd)"
          rm -rf /tmp/mpv_extract
          mkdir -p /tmp/mpv_extract "$WS/src-tauri/mpv"
          unzip -q mpv.zip -d /tmp/mpv_extract
          # macOS 资产里的 zip 解出来是 mpv.tar.gz，里面才是 mpv.app，需要再解一层
          for tgz in /tmp/mpv_extract/*.tar.gz /tmp/mpv_extract/*.tar.xz; do
            if [ -f "$tgz" ]; then
              echo "Extracting nested archive: $tgz"
              tar -xf "$tgz" -C /tmp/mpv_extract
            fi
          # 解完就删掉 tarball，别让它跟着 cp -a 混进 bundle
          rm -f /tmp/mpv_extract/*.tar.gz /tmp/mpv_extract/*.tar.xz
          done

          # 保留仓库里已提交的 src-tauri/mpv/portable_config/，只清理旧的二进制/动态库
          find "$WS/src-tauri/mpv" -maxdepth 1 -type f -delete
          # macOS 的 mpv.app 是 bundle，必须整体保留目录结构（cp -a），不能扁平复制
          cp -a /tmp/mpv_extract/. "$WS/src-tauri/mpv/"
          # 仓库根目录提交了 mpv/portable_config/（mpv/* 被 gitignore，用 ! 保留），
          # 而 bundle.resources 相对 src-tauri/，所以必须拷进 src-tauri/mpv/
          if [ -d mpv/portable_config ]; then
            mkdir -p "$WS/src-tauri/mpv/portable_config"
            cp -a mpv/portable_config/. "$WS/src-tauri/mpv/portable_config/"
          fi

          echo "MPV files in src-tauri/mpv:"
          ls -la "$WS/src-tauri/mpv"
          # Windows: 统一重命名为规范名 mpv.exe，便于运行时定位
          if [ ! -f "$WS/src-tauri/mpv/mpv.exe" ]; then
            exe="$(find "$WS/src-tauri/mpv" -name 'mpv*.exe' -type f | head -1 || true)"
            if [ -n "$exe" ]; then
              mv -f "$exe" "$WS/src-tauri/mpv/mpv.exe"
            fi
          fi
          chmod +x "$WS/src-tauri/mpv/mpv" "$WS/src-tauri/mpv/mpv.exe" 2>/dev/null || true

          # 校验：必须能找到一个可用的 mpv 可执行文件
          found=""
          for cand in "$WS/src-tauri/mpv/mpv" "$WS/src-tauri/mpv/mpv.exe" \
                      "$WS/src-tauri/mpv/mpv.app/Contents/MacOS/mpv"; do
            if [ -f "$cand" ]; then found="$cand"; break; fi
          done
          # 兜底：整个目录里搜任意一个叫 mpv[.exe] 的可执行文件
          if [ -z "$found" ]; then
            found="$(find "$WS/src-tauri/mpv" -type f -name 'mpv' -o -type f -name 'mpv.exe' 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$found" ]; then
            echo "::error::no usable mpv binary found under src-tauri/mpv"
            find "$WS/src-tauri/mpv" | head -50
            exit 1
          fi
          echo "MPV executable: $found"

      - name: Prepare MPV (Linux)
        if: matrix.runner-os == 'Linux'
        run: |
          set -e
          MPV_BIN="$(command -v mpv)"
          echo "system mpv: $MPV_BIN"
          mkdir -p src-tauri/mpv
          cp -f "$MPV_BIN" src-tauri/mpv/mpv
          chmod +x src-tauri/mpv/mpv
          # 仓库根目录提交了 mpv/portable_config/（mpv/* 被 gitignore，用 ! 保留），
          # 而 bundle.resources 相对 src-tauri/，所以必须拷进 src-tauri/mpv/
          if [ -d mpv/portable_config ]; then
            mkdir -p src-tauri/mpv/portable_config
            cp -a mpv/portable_config/. src-tauri/mpv/portable_config/
          fi
          ls -la src-tauri/mpv
          ls -la src-tauri/mpv/portable_config

      # ---------- 构建 ----------
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -e
          # 只有 tag 推送才把 ref 当版本号；分支推送（如 main）绝不能用分支名，
          # 否则会产出 "vmain" 这种荒谬的版本。非 tag 一律回退到 package.json。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(node -e "console.log(require('./package.json').version)" 2>/dev/null || echo 0.0.0)
          fi

          # 兜底：万一 package.json 读不到，也不能让版本变成 "main" / "undefined"
          case "$ver" in
            ''|main|master|HEAD|dev|undefined|null)
              echo "::error::could not resolve a sane version (got '$ver')"
              exit 1
              ;;
          esac

          echo "Resolved version: $ver"
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      # 显式跑 beforeBuildCommand 的三个动作（npm run build + sync-sidecar + build:sidecar）。
      # 原因：bundle.resources 的 glob 依赖 sidecar 的产物
      # （src-tauri/hancast_sidecar/ 和提升到根部的 *.so / *.dll / *.pyd），
      # 这些要到 beforeBuildCommand 跑完才存在。把 Preflight 放在 tauri build
      # 之前单独一步，才能在毫秒级失败而不是等 build.rs 报含糊的 glob 错误。
      - name: Build frontend
        run: npm run build
      - name: Sync sidecar sources
        run: node scripts/sync-sidecar.cjs
      - name: Build sidecar (Nuitka)
        shell: bash
        run: npm run build:sidecar
      - name: "Preflight: verify bundle.resources globs"
        run: node scripts/check-resources.cjs
      - name: Tauri bundle
        run: npx tauri build --bundles ${{ matrix.bundles }}

      # macOS 的 .app 里，Tauri 把两类东西放进了不同目录：
      #   externalBin → Contents/MacOS/hancast-sidecar
      #   resources   → Contents/Resources/{lxml,certifi,charset_normalizer,
      #                 hancast_sidecar,*.so,libpython3.12.dylib}
      # 但 Nuitka --standalone 的 sidecar 只从「可执行文件所在目录」解析
      # 模块和扩展（自己的 loader，sys.path / PYTHONPATH 都不生效），于是运行
      # 时报 ImportError: dlopen(.../Contents/MacOS/lxml/etree.so) (no such file)。
      # 在 MacOS/ 里对 Resources/ 的内容建符号链接，即可让 sidecar 与
      # Windows/Linux 一样看到扁平布局。符号链接随 .app 一起进 dmg。
      - name: Fix macOS sidecar resource layout
        if: matrix.runner-os == 'macOS'
        shell: bash
        run: |
          set -e
          APP="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::no .app found under bundle/macos"
            exit 1
          fi
          MACOS="$APP/Contents/MacOS"
          RES="$APP/Contents/Resources"
          echo "app: $APP"

          # 对 Resources/ 的每一项在 MacOS/ 建同名链接（已存在则跳过）
          linked=0
          for item in "$RES"/*; do
            name="$(basename "$item")"
            [ "$name" = "icon.icns" ] && continue   # app 图标，无需链接
            [ "$name" = "Assets.car" ] && continue  # 同上
            if [ -e "$MACOS/$name" ]; then
              continue
            fi
            ln -sfn "../Resources/$name" "$MACOS/$name"
            linked=$((linked + 1))
          done
          echo "linked $linked entries into Contents/MacOS/"

          echo "=== Contents/MacOS/ after linking ==="
          ls -la "$MACOS"

          # 冒烟测试：直接执行 sidecar，确认能 import 到 lxml 且 SSDP 起来。
          # sidecar 收到 stdin EOF 会自行退出；但 CI 里 stdin 不一定是 EOF，
          # 所以要有超时兜底。注意 macOS runner 上没有 GNU 的 timeout
          # （那是 coreutils 的 gtimeout），所以这里自己实现一个。
          cat > "$RUNNER_TEMP/sidecar_timeout.sh" <<'HELPER'
          # 在指定秒数后杀掉命令并回收，替代 GNU timeout（macOS runner 上没有）。
          run_sidecar_with_timeout() {
            secs="$1"; shift
            "$@" &
            pid=$!
            waited=0
            while kill -0 "$pid" 2>/dev/null && [ "$waited" -lt "$secs" ]; do
              sleep 1
              waited=$((waited + 1))
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -TERM "$pid" 2>/dev/null || true
            fi
            wait "$pid" 2>/dev/null || true
          }
          HELPER
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/sidecar_timeout.sh"
          echo "=== sidecar smoke test ==="
          out="$(cd "$MACOS" && run_sidecar_with_timeout 20 ./hancast-sidecar 2>&1 || true)"
          echo "$out" | head -30
          if echo "$out" | grep -q "ImportError\|Library not loaded\|Traceback"; then
            echo "::error::sidecar failed to start inside the .app bundle"
            exit 1
          fi
          if ! echo "$out" | grep -q "DLNA server started"; then
            echo "::error::sidecar did not reach 'DLNA server started'"
            exit 1
          fi
          echo "sidecar OK"

      # 自己打 dmg，而不是再调一次 `tauri build --bundles dmg`。
      # 原因：dmg bundler 会重新跑一遍 cargo 并重建 .app（日志里能看到
      # Compiling → Bundling HanCast.app），重建出来的 .app 没有上一步的
      # 符号链接，等于白修；打完它还会把 bundle/macos 下的 .app 删掉。
      # 这里直接用已修好的 .app 造 dmg，产出可控，也让 dmg 与 .app 内容一致。
      - name: Bundle macOS dmg
        if: matrix.runner-os == 'macOS'
        shell: bash
        run: |
          set -e
          APP="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::no .app found under bundle/macos"
            exit 1
          fi

          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          out="src-tauri/target/release/bundle/dmg/HanCast_${VERSION}_aarch64.dmg"
          mkdir -p "$(dirname "$out")"
          rm -f "$out"
          hdiutil create -volname "HanCast" -srcfolder "$STAGE" -ov -format UDZO "$out"
          rm -rf "$STAGE"
          echo "=== dmg ==="
          ls -lh "$out"

          # 挂载 dmg 里的 .app 真跑一次 sidecar，确保链接确实进了 dmg
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -quiet -mountpoint "$MNT" "$out"
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/sidecar_timeout.sh"
          echo "=== dmg sidecar smoke test ==="
          out_log="$(cd "$MNT"/*.app/Contents/MacOS && run_sidecar_with_timeout 20 ./hancast-sidecar 2>&1 || true)"
          hdiutil detach "$MNT" -quiet || true
          rmdir "$MNT" 2>/dev/null || true
          echo "$out_log" | head -20
          if echo "$out_log" | grep -q "ImportError\|Library not loaded\|Traceback"; then
            echo "::error::sidecar inside the dmg failed to start"
            exit 1
          fi
          if ! echo "$out_log" | grep -q "DLNA server started"; then
            echo "::error::sidecar inside the dmg never reached 'DLNA server started'"
            exit 1
          fi
          echo "dmg sidecar OK"

      # ---------- 收集产物 ----------
      - name: List bundle output
        shell: bash
        run: |
          echo "=== bundle dir ==="
          find src-tauri/target/release/bundle -type f 2>/dev/null || true

      # bundle/ 里除最终安装包外还有一堆中间产物（未压缩的 .app 树、
      # AppDir/、deb 解包目录、bundle_dmg.sh 等），全传上去既臃肿又难挑。
      # 这里只把「用户真正要下载的东西」归拢到 dist/。
      - name: Stage final installers
        shell: bash
        run: |
          set -e
          B="src-tauri/target/release/bundle"
          rm -rf dist && mkdir -p dist
          # 必须 -type f 且只吃最终安装包扩展名；
          # 目录（*.app / *.AppDir / deb 解包目录）一律不进 dist。
          find "$B" -type f \( \
              -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
              -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            \) -exec cp -v {} dist/ \;
          echo "=== staged ==="
          ls -lh dist/

      # 合一 artifact（供 release 使用）。用 bundle- 前缀与其他区分开，
      # release job 只按 bundle-* 下载，不会重复拿到下面按格式拆分的那些。
      - name: Upload artifacts (all installers)
        uses: actions/upload-artifact@v4
        with:
          name: bundle-HanCast-${{ env.VERSION }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # ---------- 按格式拆分 ----------
      # Linux 同时产出 deb / rpm / AppImage，混在一个包里用户得整个下载。
      # 拆成独立 artifact 后可只取需要的格式；其他平台上对应 glob 匹配不到，
      # 用 if-no-files-found: ignore 静默跳过。
      - name: Upload artifacts (dmg)
        uses: actions/upload-artifact@v4
        with:
          name: HanCast-${{ env.VERSION }}-${{ matrix.name }}.dmg
          path: dist/*.dmg
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifacts (exe)
        uses: actions/upload-artifact@v4
        with:
          name: HanCast-${{ env.VERSION }}-${{ matrix.name }}.exe
          path: dist/*.exe
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifacts (deb)
        uses: actions/upload-artifact@v4
        with:
          name: HanCast-${{ env.VERSION }}-${{ matrix.name }}.deb
          path: dist/*.deb
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifacts (rpm)
        uses: actions/upload-artifact@v4
        with:
          name: HanCast-${{ env.VERSION }}-${{ matrix.name }}.rpm
          path: dist/*.rpm
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifacts (AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: HanCast-${{ env.VERSION }}-${{ matrix.name }}.AppImage
          path: dist/*.AppImage
          if-no-files-found: ignore
          retention-days: 14

  # 汇总版本（供 release 步骤读取）
  read_version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          set -e
          # 同 build job：只有 tag 才把 ref 当版本号，分支名不能当版本
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(node -e "console.log(require('./package.json').version)" 2>/dev/null || echo 0.0.0)
          fi
          case "$ver" in
            ''|main|master|HEAD|dev|undefined|null)
              echo "::error::could not resolve a sane version (got '$ver')"
              exit 1
              ;;
          esac
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  release:
    name: Upload to draft Release
    needs: [build, read_version]
    if: >
      needs.build.result == 'success' &&
      github.ref_type == 'tag' &&
      ( github.event_name == 'push' || inputs.make_release == true )
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          # 只取每个平台「全格式合一」的 bundle-* artifact。
          # 按格式拆分的那些（HanCast-<ver>-<platform>-linux-deb 等）不在
          # 这个 pattern 里；否则同一个安装包会被下载两次，release 上传报错。
          pattern: bundle-*
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== artifacts ==="
          find artifacts -type f 2>/dev/null || true

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app
            artifacts/**/*.app.tar.gz
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
