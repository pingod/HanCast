# 构建 macOS / Linux / Windows 安装包
#
# 说明：
#   - 仓库里 mpv/ 目录被 gitignore（~120MB，未提交）。CI 会为每个平台准备 MPV：
#       * macOS  / Windows : 从 mpv-player/mpv 官方 Release 下载对应平台二进制
#       * Linux          : 通过 apt 安装 mpv，再复制其二进制
#   - 不执行代码签名。
#   - 前端构建 + sidecar(Nuitka) 打包由 tauri.conf.json 的 beforeBuildCommand 自动完成，
#     CI 只需装好工具链、放好 mpv，然后调用 `tauri build`。
#
# 触发：
#   - push 标签 v*  → 自动构建并上传 draft Release
#   - 手动 workflow_dispatch

name: Build Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      make_release:
        description: "构建成功后创建 draft GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  # 缓存 / 镜像加速（可按需调整）
  UV_PYTHON_PREFERENCE: only-managed
  # 固定 MPV 版本，避免运行时依赖 api.github.com（易被限流 403）。
  # 资产已确认存在：mpv-v0.41.0-{macos-15-arm, x86_64-pc-windows-msvc}.zip
  MPV_TAG: "v0.41.0"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- macOS ----
          - name: macos-arm64
            os: macos-14
            runner-os: macOS
            arch: aarch64-apple-darwin
            bundles: "app,dmg"
            mpv_suffix: "macos-15-arm"
          # ---- Windows ----
          - name: windows-x64
            os: windows-latest
            runner-os: Windows
            arch: x86_64-pc-windows-msvc
            bundles: "nsis"
            mpv_suffix: "x86_64-pc-windows-msvc"
          # ---- Linux ----
          - name: linux-x64
            os: ubuntu-latest
            runner-os: Linux
            arch: x86_64-unknown-linux-gnu
            bundles: "deb,rpm,appimage"
            mpv_suffix: ""   # Linux 走 apt

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      # ---------- 通用工具链 ----------
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup uv (Python)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Show toolchain versions
        shell: bash
        run: |
          set -e
          echo "=== OS ==="
          uname -a || true
          echo "=== rust ==="
          rustc --version
          cargo --version
          echo "=== node ==="
          node --version
          npm --version
          echo "=== uv ==="
          uv --version
          echo "=== python (managed) ==="
          uv run --project hancast-backend python --version 2>/dev/null || true

      # ---------- 平台依赖 ----------
      - name: Install Linux build deps (Tauri + Nuitka C compiler)
        if: matrix.runner-os == 'Linux'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            g++ pkg-config \
            mpv
          echo "Linux deps installed. mpv:"
          mpv --version | head -1 || true

      - name: Install frontend dependencies
        run: npm ci

      # ---------- 准备 MPV ----------

      - name: Download & unpack MPV (macOS / Windows)
        if: matrix.mpv_suffix != ''
        shell: bash
        env:
          MPV_SUFFIX: ${{ matrix.mpv_suffix }}
        run: |
          set -e
          url="https://github.com/mpv-player/mpv/releases/download/${MPV_TAG}/mpv-${MPV_TAG}-${MPV_SUFFIX}.zip"
          echo "Downloading: $url"
          curl -fsSL -o mpv.zip "$url"
          WS="$(pwd)"
          rm -rf /tmp/mpv_extract
          mkdir -p /tmp/mpv_extract "$WS/src-tauri/mpv"
          unzip -q mpv.zip -d /tmp/mpv_extract
          # macOS 资产里的 zip 解出来是 mpv.tar.gz，里面才是 mpv.app，需要再解一层
          for tgz in /tmp/mpv_extract/*.tar.gz /tmp/mpv_extract/*.tar.xz; do
            if [ -f "$tgz" ]; then
              echo "Extracting nested archive: $tgz"
              tar -xf "$tgz" -C /tmp/mpv_extract
            fi
          done

          # 保留仓库里已提交的 src-tauri/mpv/portable_config/，只清理旧的二进制/动态库
          find "$WS/src-tauri/mpv" -maxdepth 1 -type f -delete
          # macOS 的 mpv.app 是 bundle，必须整体保留目录结构（cp -a），不能扁平复制
          cp -a /tmp/mpv_extract/. "$WS/src-tauri/mpv/"
          # 仓库根目录提交了 mpv/portable_config/（mpv/* 被 gitignore，用 ! 保留），
          # 而 bundle.resources 相对 src-tauri/，所以必须拷进 src-tauri/mpv/
          if [ -d mpv/portable_config ]; then
            mkdir -p "$WS/src-tauri/mpv/portable_config"
            cp -a mpv/portable_config/. "$WS/src-tauri/mpv/portable_config/"
          fi

          echo "MPV files in src-tauri/mpv:"
          ls -la "$WS/src-tauri/mpv"
          # Windows: 统一重命名为规范名 mpv.exe，便于运行时定位
          if [ ! -f "$WS/src-tauri/mpv/mpv.exe" ]; then
            exe="$(find "$WS/src-tauri/mpv" -name 'mpv*.exe' -type f | head -1 || true)"
            if [ -n "$exe" ]; then
              mv -f "$exe" "$WS/src-tauri/mpv/mpv.exe"
            fi
          fi
          chmod +x "$WS/src-tauri/mpv/mpv" "$WS/src-tauri/mpv/mpv.exe" 2>/dev/null || true

          # 校验：必须能找到一个可用的 mpv 可执行文件
          found=""
          for cand in "$WS/src-tauri/mpv/mpv" "$WS/src-tauri/mpv/mpv.exe" \
                      "$WS/src-tauri/mpv/mpv.app/Contents/MacOS/mpv"; do
            if [ -f "$cand" ]; then found="$cand"; break; fi
          done
          # 兜底：整个目录里搜任意一个叫 mpv[.exe] 的可执行文件
          if [ -z "$found" ]; then
            found="$(find "$WS/src-tauri/mpv" -type f -name 'mpv' -o -type f -name 'mpv.exe' 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$found" ]; then
            echo "::error::no usable mpv binary found under src-tauri/mpv"
            find "$WS/src-tauri/mpv" | head -50
            exit 1
          fi
          echo "MPV executable: $found"

      - name: Prepare MPV (Linux)
        if: matrix.runner-os == 'Linux'
        run: |
          set -e
          MPV_BIN="$(command -v mpv)"
          echo "system mpv: $MPV_BIN"
          mkdir -p src-tauri/mpv
          cp -f "$MPV_BIN" src-tauri/mpv/mpv
          chmod +x src-tauri/mpv/mpv
          # 仓库根目录提交了 mpv/portable_config/（mpv/* 被 gitignore，用 ! 保留），
          # 而 bundle.resources 相对 src-tauri/，所以必须拷进 src-tauri/mpv/
          if [ -d mpv/portable_config ]; then
            mkdir -p src-tauri/mpv/portable_config
            cp -a mpv/portable_config/. src-tauri/mpv/portable_config/
          fi
          ls -la src-tauri/mpv
          ls -la src-tauri/mpv/portable_config

      # ---------- 构建 ----------
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -e
          if [ -n "${GITHUB_REF_NAME}" ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(node -e "console.log(require('./package.json').version)" 2>/dev/null || echo dev)
          fi
          echo "Resolved version: $ver"
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      # 显式跑 beforeBuildCommand 的三个动作（npm run build + sync-sidecar + build:sidecar）。
      # 原因：bundle.resources 的 glob 依赖 sidecar 的产物
      # （src-tauri/hancast_sidecar/ 和提升到根部的 *.so / *.dll / *.pyd），
      # 这些要到 beforeBuildCommand 跑完才存在。把 Preflight 放在 tauri build
      # 之前单独一步，才能在毫秒级失败而不是等 build.rs 报含糊的 glob 错误。
      - name: Build frontend
        run: npm run build
      - name: Sync sidecar sources
        run: node scripts/sync-sidecar.cjs
      - name: Build sidecar (Nuitka)
        shell: bash
        run: npm run build:sidecar
      - name: "Preflight: verify bundle.resources globs"
        run: node scripts/check-resources.cjs
      - name: Tauri bundle
        run: npx tauri build --bundles ${{ matrix.bundles }}

      # ---------- 收集产物 ----------
      - name: List bundle output
        shell: bash
        run: |
          echo "=== bundle dir ==="
          find src-tauri/target/release/bundle -type f 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HanCast-${{ matrix.name }}-v${{ env.VERSION }}
          path: src-tauri/target/release/bundle/*
          if-no-files-found: error
          retention-days: 14

  # 汇总版本（供 release 步骤读取）
  read_version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          set -e
          if [ -n "${GITHUB_REF_NAME}" ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(node -e "console.log(require('./package.json').version)" 2>/dev/null || echo "dev")
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  release:
    name: Upload to draft Release
    needs: [build, read_version]
    if: >
      needs.build.result == 'success' &&
      ( github.event_name == 'push' || inputs.make_release == true )
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== artifacts ==="
          find artifacts -type f 2>/dev/null || true

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app
            artifacts/**/*.app.tar.gz
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
