# 构建 macOS / Linux / Windows 安装包
#
# 说明：
#   - 仓库里 mpv/ 目录被 gitignore（~120MB，未提交）。CI 会为每个平台准备 MPV：
#       * macOS  / Windows : 从 mpv-player/mpv 官方 Release 下载对应平台二进制
#       * Linux          : 通过 apt 安装 mpv，再复制其二进制
#   - 不执行代码签名。
#   - 前端构建 + sidecar(Nuitka) 打包由 tauri.conf.json 的 beforeBuildCommand 自动完成，
#     CI 只需装好工具链、放好 mpv，然后调用 `tauri build`。
#
# 触发：
#   - push 标签 v*  → 自动构建并上传 draft Release
#   - 手动 workflow_dispatch

name: Build Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      make_release:
        description: "构建成功后创建 draft GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  # 缓存 / 镜像加速（可按需调整）
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- macOS ----
          - name: macos-arm64
            os: macos-14
            runner-os: macOS
            arch: aarch64-apple-darwin
            bundles: "app,dmg"
            mpv_suffix: "macos-15-arm"
          # ---- Windows ----
          - name: windows-x64
            os: windows-latest
            runner-os: Windows
            arch: x86_64-pc-windows-msvc
            bundles: "nsis"
            mpv_suffix: "x86_64-pc-windows-msvc"
          # ---- Linux ----
          - name: linux-x64
            os: ubuntu-latest
            runner-os: Linux
            arch: x86_64-unknown-linux-gnu
            bundles: "deb,rpm,appimage"
            mpv_suffix: ""   # Linux 走 apt

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      # ---------- 通用工具链 ----------
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup uv (Python)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Show toolchain versions
        shell: bash
        run: |
          set -e
          echo "=== OS ==="
          uname -a || true
          echo "=== rust ==="
          rustc --version
          cargo --version
          echo "=== node ==="
          node --version
          npm --version
          echo "=== uv ==="
          uv --version
          echo "=== python (managed) ==="
          uv run --project hancast-backend python --version 2>/dev/null || true

      # ---------- 平台依赖 ----------
      - name: Install Linux build deps (Tauri + Nuitka C compiler)
        if: matrix.runner-os == 'Linux'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            g++ pkg-config \
            mpv
          echo "Linux deps installed. mpv:"
          mpv --version | head -1 || true

      - name: Install frontend dependencies
        run: npm ci

      # ---------- 准备 MPV ----------
      - name: Resolve latest mpv release tag
        if: matrix.mpv_suffix != ''
        id: mpv_tag
        shell: bash
        run: |
          set -e
          tag=$(curl -fsSL https://api.github.com/repos/mpv-player/mpv/releases/latest \
                  | grep -o '"tag_name":[^,]*' | sed 's/.*"\([^"]*\)".*/\1/')
          echo "latest mpv tag: $tag"
          echo "MPV_TAG=$tag" >> "$GITHUB_ENV"

      - name: Download & unpack MPV (macOS / Windows)
        if: matrix.mpv_suffix != ''
        shell: bash
        env:
          MPV_SUFFIX: ${{ matrix.mpv_suffix }}
        run: |
          set -e
          url="https://github.com/mpv-player/mpv/releases/download/${MPV_TAG}/mpv-${MPV_TAG}-${MPV_SUFFIX}.zip"
          echo "Downloading: $url"
          curl -fsSL -o mpv.zip "$url"
          rm -rf /tmp/mpv_extract && mkdir -p /tmp/mpv_extract
          unzip -q mpv.zip -d /tmp/mpv_extract

          rm -rf src-tauri/mpv && mkdir -p src-tauri/mpv
          # 把解压出的所有文件（mpv 可执行文件 + 依赖库）扁平复制到 src-tauri/mpv
          (cd /tmp/mpv_extract && find . -type f -print0 | while IFS= read -r -d '' f; do
            cp -f "$f" src-tauri/mpv/ || true
          done)
          mkdir -p src-tauri/mpv/portable_config
          echo "MPV files in src-tauri/mpv:"
          ls -la src-tauri/mpv
          # 重命名为规范名，方便资源打包 / 运行时定位
          if [ -f src-tauri/mpv/mpv.exe ]; then
            : # 已是规范名
          elif [ -n "$(find src-tauri/mpv -maxdepth 1 -name 'mpv*.exe' -print -quit)" ]; then
            mv -f "$(find src-tauri/mpv -maxdepth 1 -name 'mpv*.exe' | head -1)" src-tauri/mpv/mpv.exe
          elif [ -f src-tauri/mpv/mpv ]; then
            :
          else
            mv -f "$(find src-tauri/mpv -maxdepth 1 -name 'mpv*' -type f | head -1)" src-tauri/mpv/mpv
          fi
          chmod +x src-tauri/mpv/mpv src-tauri/mpv/mpv.exe 2>/dev/null || true

      - name: Prepare MPV (Linux)
        if: matrix.runner-os == 'Linux'
        run: |
          set -e
          MPV_BIN="$(command -v mpv)"
          echo "system mpv: $MPV_BIN"
          rm -rf src-tauri/mpv && mkdir -p src-tauri/mpv/portable_config
          cp -f "$MPV_BIN" src-tauri/mpv/mpv
          chmod +x src-tauri/mpv/mpv
          ls -la src-tauri/mpv

      # ---------- 构建 ----------
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -e
          if [ -n "${GITHUB_REF_NAME}" ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(node -e "console.log(require('./package.json').version)" 2>/dev/null || echo dev)
          fi
          echo "Resolved version: $ver"
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - name: Build (frontend + Nuitka sidecar + Tauri bundle)
        run: npx tauri build --bundles ${{ matrix.bundles }}

      # ---------- 收集产物 ----------
      - name: List bundle output
        shell: bash
        run: |
          echo "=== bundle dir ==="
          find src-tauri/target/release/bundle -type f 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HanCast-${{ matrix.name }}-v${{ env.VERSION }}
          path: src-tauri/target/release/bundle/*
          if-no-files-found: error
          retention-days: 14

  # 汇总版本（供 release 步骤读取）
  read_version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          set -e
          if [ -n "${GITHUB_REF_NAME}" ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(node -e "console.log(require('./package.json').version)" 2>/dev/null || echo "dev")
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  release:
    name: Upload to draft Release
    needs: [build, read_version]
    if: >
      needs.build.result == 'success' &&
      ( github.event_name == 'push' || inputs.make_release == true )
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== artifacts ==="
          find artifacts -type f 2>/dev/null || true

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app
            artifacts/**/*.app.tar.gz
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
