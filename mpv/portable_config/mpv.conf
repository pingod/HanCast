# ==========================================================================
#  HanCast 播放器配置 (mpv.conf)
#
#  放置位置: <程序目录>/mpv/portable_config/mpv.conf
#  由 macOS / Windows 的 shinchiro 官方构建自动读取该 portable_config 目录。
#  Linux 的发行版 mpv 通常不读取 portable_config, 需要时由 HanCast 通过
#  --config-dir 参数显式指定。
#
#  ⚠️ 不要在此配置以下选项: 它们由 hancast_sidecar/renderer/mpv.py 在启动时
#     通过命令行参数注入, 写在这里会被命令行覆盖, 造成难以排查的行为差异。
#       input-ipc-server / idle / hwdec / save-position-on-quit
#       image-display-duration / on-all-workspaces
#       ontop-level / macos-app-activation-policy (仅 macOS)
# ==========================================================================

# 不显示 mpv 自带的 OSD 进度控制条 —— 进度/音量由 HanCast 前端界面负责
osc=no

# OSD 仅显示纯文本 (等级 1), 不叠加常驻进度条
osd-level=1

# 禁止弹出专辑封面窗口 (播放音乐文件时 mpv 默认会开一个独立窗口)
audio-display=no

# 窗口始终在最前由 mpv.py 针对 macOS 显式设置, 此处不再重复, 避免与前端
# 的窗口置顶逻辑互相覆盖
# ontop=yes
