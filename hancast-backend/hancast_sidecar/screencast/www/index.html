<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HanCast 屏幕投屏 · 观看</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0d0f14;
    color: #e8eaf0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 16px;
  }
  .stage {
    width: 100%; max-width: 960px;
    background: #14171f; border-radius: 16px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    position: relative; aspect-ratio: 16 / 9;
    display: flex; align-items: center; justify-content: center;
  }
  video {
    width: 100%; height: 100%; object-fit: contain; background: #0d0f14;
    display: none;
  }
  /* 自动播放策略只能免手势静音起播，解除静音要点一下 —— 按钮悬浮在画面下缘 */
  #soundBtn {
    display: none; position: absolute; z-index: 2;
    left: 50%; bottom: 12%; transform: translateX(-50%);
    padding: 10px 20px; border: none; border-radius: 999px;
    background: rgba(91,140,255,.95); color: #fff;
    font-size: 15px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.45);
  }
  #soundBtn:hover { background: #7ba4ff; }
  .placeholder { text-align: center; color: #8a91a5; padding: 24px; }
  .placeholder .pulse {
    width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 50%;
    border: 3px solid #2a3040; border-top-color: #5b8cff;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    margin-top: 14px; font-size: 13px; color: #8a91a5;
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #5b8cff; }
  .dot.err { background: #ff5c6c; }
  .dot.ok { background: #3ecf8e; }
  .err-text { color: #ff5c6c; font-size: 13px; margin-top: 10px; text-align: center; }
  .footer { margin-top: 18px; font-size: 12px; color: #565d6e; }
</style>
</head>
<body>
  <div class="stage">
    <video id="video" playsinline controls></video>
    <button id="soundBtn" type="button">点击开启声音</button>
    <div class="placeholder" id="placeholder">
      <div class="pulse"></div>
      <div>正在接入投屏画面…</div>
    </div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">连接中</span></div>
  <div class="err-text" id="errText" style="display:none"></div>
  <div class="footer">HanCast 屏幕投屏 · 浏览器直接观看（局域网，约 1-3 秒延迟）</div>

<script src="/static/hls.min.js"></script>
<script>
(function () {
  var sessionId = "__SESSION_ID__";
  // 延迟档由 HanCast 设置页下发（观看页响应里注入）
  var playerCfg = __PLAYER_CONFIG__;
  // 相对同源路径：换机器、换端口、手机热点都不受影响
  var m3u8 = "/hls/" + encodeURIComponent(sessionId) + "/live.m3u8";
  var video = document.getElementById("video");
  var placeholder = document.getElementById("placeholder");
  var soundBtn = document.getElementById("soundBtn");
  var statusText = document.getElementById("statusText");
  var dot = document.getElementById("dot");
  var errText = document.getElementById("errText");
  var hls = null;
  var stopped = false;

  // 自动播放策略只放过免手势的静音起播，出声必须由用户手势触发。
  // 起播先试带声（Safari 允许自动播放时能直接出声、完全无感），被拒才
  // 退回静音起播并亮出「点击开启声音」按钮；按钮点击或原生控件解除静音
  // 都算手势，解除后就收起按钮。
  var needManualSound = false;   // 当前是静音起播的，等着用户点按钮出声
  var playHandled = false;       // 本次起播已定性（成功或已退回静音）
  var playingStarted = false;

  video.addEventListener("playing", function () { playingStarted = true; });
  video.addEventListener("volumechange", function () {
    if (!video.muted) {
      needManualSound = false;
      soundBtn.style.display = "none";
    }
  });

  soundBtn.addEventListener("click", function () {
    // 真实手势下的解除静音不会再被策略拦。play() 万一失败（流刚结束等）
    // 就跟回去保持静音，错误路径另有处理，这里不炸即可
    video.muted = false;
    var p = video.play();
    if (p && p.catch) p.catch(function () { video.muted = true; });
  });

  function fallbackToMuted() {
    needManualSound = true;
    video.muted = true;
    var p = video.play();
    if (p && p.catch) p.catch(function () {});
  }

  function tryStart() {
    if (needManualSound) {  // 已知本浏览器拦带声起播（重连时别重复挨拒）
      fallbackToMuted();
      return;
    }
    playHandled = false;
    var p = video.play();
    if (p && p.then) {
      p.then(function () { playHandled = true; }).catch(function () {
        if (!playHandled) {
          playHandled = true;
          fallbackToMuted();
        }
      });
    }
    // 保险丝：个别引擎的 play() 被拦下时既不 resolve 也不 reject（要等
    // 有数据才表态），1.2 秒画面还没起来就切静音路径，别让用户干等
    setTimeout(function () {
      if (!playHandled && !playingStarted) {
        playHandled = true;
        fallbackToMuted();
      }
    }, 1200);
  }

  function setStatus(text, cls) {
    statusText.textContent = text;
    dot.className = "dot" + (cls ? " " + cls : "");
  }
  function setError(text) {
    errText.textContent = text;
    errText.style.display = "block";
    setStatus("已结束", "err");
  }
  function showVideo() {
    placeholder.style.display = "none";
    video.style.display = "block";
    setStatus("正在观看", "ok");
    if (needManualSound) soundBtn.style.display = "block";
  }

  function nativeHls() {
    return video.canPlayType("application/vnd.apple.mpegurl") !== "";
  }

  function startNative() {
    video.src = m3u8;
    tryStart();
    video.addEventListener("playing", showVideo);
    video.addEventListener("error", function () {
      setError("投屏已结束或画面源不可用");
    });
  }

  function startHlsJs() {
    hls = new Hls(Object.assign({
      enableWorker: true,
      manifestLoadingMaxRetry: 4,
      manifestLoadingRetryDelay: 1000,
      levelLoadingMaxRetry: 4,
      fragLoadingMaxRetry: 4,
    }, playerCfg));
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      tryStart();
    });
    hls.on(Hls.Events.FRAG_BUFFERED, showVideo);
    hls.on(Hls.Events.ERROR, function (_ev, data) {
      if (!data.fatal || stopped) return;
      if (data.response && data.response.code === 404) {
        // 播放列表 404 = 投屏已停止（分片目录被清理），不再无限重试
        setError("投屏已结束");
        return;
      }
      setStatus("重连中…");
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
      else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      else {
        hls.destroy();
        hls = null;
        setTimeout(startHlsJs, 1500);
      }
    });
    hls.loadSource(m3u8);
    hls.attachMedia(video);
  }

  if (typeof Hls !== "undefined" && Hls.isSupported()) startHlsJs();
  else if (nativeHls()) startNative();
  else setError("此浏览器不支持 HLS 播放，请用 Safari / Chrome / Edge 打开");

  window.addEventListener("beforeunload", function () {
    stopped = true;
    if (hls) hls.destroy();
  });
})();
</script>
</body>
</html>
