[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hancast-sidecar"
# version synced from tauri.conf.json
version = "2.4.2"
description = "HanCast Python Sidecar"
readme = "README.md"
license = "GPL-3.0"
requires-python = ">=3.11"
authors = [
    { name = "lanzeweie@foxmail.com" },
]

dependencies = [
    "requests>=2.28.0",
    "lxml>=4.9.0",
    "netifaces>=0.11.0",
    # 屏幕投屏浏览器观看：aiohttp 直接供 HLS，不再依赖 WebRTC（aiortc 已移除）
    "aiohttp>=3.9.0",
    # Windows 系统声音：FFmpeg 没有 WASAPI 输入（ticket #9408 未合并），
    # 用 PortAudio 的 WASAPI 环回分支把渲染设备采成 PCM。PyPI 只发 Windows
    # wheel，所以按平台标记声明，macOS/Linux 不会被拖进构建。
    "pyaudiowpatch>=0.2.12.9; sys_platform == 'win32'",
    "quickjs>=1.19.4",
    "cssselect>=1.6.0",
    # TLS/JA3 指纹伪造（utils/httpclient.py）：按 UA 用对应浏览器握手。
    # 三端都有 wheel（macOS arm64/x86_64、Windows amd64、Linux x86_64/aarch64），
    # 装不上时代码会退回 requests，不会让解析整条链挂掉。
    "curl_cffi>=0.16.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "nuitka>=2.0",
    "ordered-set>=4.0",
    "zstandard>=0.22.0",
]

[project.scripts]
hancast-sidecar = "hancast_sidecar.main:main"

[tool.hatch.build.targets.wheel]
packages = ["hancast_sidecar"]
